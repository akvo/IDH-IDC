name: Build & Test
on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'feature*'
      - 'epic/**'
      - 'epic*'
  pull_request:
    branches:
      - main
      - develop
      - staging
      - 'feature/**'
      - 'feature*'
      - 'epic/**'
      - 'epic*'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        run: |
          ./ci/build.sh
